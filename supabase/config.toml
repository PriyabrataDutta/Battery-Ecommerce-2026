project_id = "uzpzqkzkdkeboplmgowy"

[functions.client-ip]
verify_jwt = false

[functions.phone-login]
verify_jwt = false


[functions.cashfree-webhook]
verify_jwt = false

[functions.auth-email]
verify_jwt = false

# Auth/storage values pinned to the live project's settings (as of 2026-11-18),
# because `supabase config push` sends the WHOLE config and would otherwise
# reset them to local defaults. Change these deliberately, never by omission.
[auth]
site_url = "https://www.kachibatteries.com"
additional_redirect_urls = ["https://www.kachibatteries.com/**", "https://kachibatteries.com/**", "https://battery-ecommerce-2026.vercel.app/**"]
# Password policy (2026-11-19) — set the same values in the dashboard:
# Authentication → Providers → Email.
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8

[storage.vector]
enabled = false

# Branded auth emails (supabase/functions/auth-email). The secret is read from
# the environment at push time and never committed.
[auth.hook.send_email]
enabled = true
uri = "https://uzpzqkzkdkeboplmgowy.supabase.co/functions/v1/auth-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"
